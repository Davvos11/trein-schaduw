apiVersion: apps/v1
kind: Deployment
metadata:
  name: trein-schaduw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      containers:
        - name: app
          image: app # replaced by kustomize
          # Only Traefik reaches this pod, and it replaces X-Forwarded-* from untrusted sources (it trusts
          # Cloudflare's edge): trust the headers and take the leftmost X-Forwarded-For entry as client.
          args: ["--host", "0.0.0.0", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
          envFrom:
            - secretRef:
                name: trein-schaduw-env
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      # Only for private GHCR images (ghcr_pull_secret = true in infra-tg):
      # imagePullSecrets:
      #   - name: ghcr-pull
