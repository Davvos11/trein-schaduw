apiVersion: apps/v1
kind: Deployment
metadata:
  name: trein-schaduw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      containers:
        - name: app
          image: app # replaced by kustomize
          # Behind Traefik (host network: connects from the cni0 gateway 10.42.0.1): trust its
          # X-Forwarded-Proto/-For, so the app sees https and Traefik's view of the client.
          args: ["--host", "0.0.0.0", "--proxy-headers", "--forwarded-allow-ips", "10.42.0.1"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
          envFrom:
            - secretRef:
                name: trein-schaduw-env
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      # Only for private GHCR images (ghcr_pull_secret = true in infra-tg):
      # imagePullSecrets:
      #   - name: ghcr-pull
